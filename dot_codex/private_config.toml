approvals_reviewer = "auto_review"
model = "gpt-6.1-sol"
model_context_window = 1000000
model_reasoning_effort = "high"
personality = "pragmatic"
plan_mode_reasoning_effort = "high"
service_tier = "fast"

[agents]
enabled = true
default_subagent_reasoning_effort = "medium"

[desktop]
avatar-overlay-pet-visible = false
composer-predictions-enabled = false
confirm-before-close = "never"
conversationDetailMode = "STEPS_PROSE"
followUpQueueMode = "steer"
open-link-in-target-preference = "external-browser"
open-local-url-in-target-preference = "external-browser"
preventSleepWhileRunning = true
show-context-window-usage = true

[desktop.open-in-target-preferences]
global = "fileManager"

[features]
workspace_dependencies = false

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "branch-changes", "approval-mode", "task-progress", "context-used", "total-input-tokens", "total-output-tokens"]
status_line_use_colors = true
screen_reader_detection_done = true
